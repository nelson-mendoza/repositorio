<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ContratoExpress{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% if session.user_id %}
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-file-contract"></i>
            <span>ContratoExpress</span>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}"><i class="fas fa-home"></i> Inicio</a>
            <a href="{{ url_for('new_contract') }}" class="{% if request.endpoint == 'new_contract' %}active{% endif %}"><i class="fas fa-plus-circle"></i> Nuevo Contrato</a>
            <a href="{{ url_for('history') }}" class="{% if request.endpoint == 'history' %}active{% endif %}"><i class="fas fa-history"></i> Historial</a>
            <div class="nav-user">
                <span><i class="fas fa-user"></i> {{ session.username }}</span>
                <a href="{{ url_for('logout') }}" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>
    </nav>
    <main class="main-content">
    {% else %}
    <main class="auth-container">
    {% endif %}
        {% block content %}{% endblock %}
    {% if session.user_id %}</main>{% else %}</main>{% endif %}
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
